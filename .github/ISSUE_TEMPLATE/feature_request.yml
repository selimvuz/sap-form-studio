name: Feature request
description: Propose an improvement to layout authoring or compatibility.
title: '[Feature]: '
body:
  - type: markdown
    attributes:
      value: |
        Describe the authoring task you want to complete. Examples are optional; attach only sanitized XDP/XSD files or screenshots that you are permitted to publish. Keep business secrets, personal data, credentials, internal system addresses, and proprietary form content out of public issues.
  - type: textarea
    id: use_case
    attributes:
      label: What task is difficult today?
      description: Explain the workflow and any current workaround.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: Describe the change and a concrete example of a successful result. Note any XDP content that must remain unchanged.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Alternatives or sanitized examples (optional)
      description: Include relevant alternatives, constraints, or a minimal sanitized XDP/XSD example. Do not attach an unsanitized working project.
  - type: checkboxes
    id: privacy
    attributes:
      label: Sharing check
      options:
        - label: I have removed confidential and personal information from this request and any attachments, and I am permitted to share them publicly.
          required: true
